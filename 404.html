<script>
(() => {
  const routes = {
    '页面/电机控制/PWM教学实验.html': '页面/电机控制/PWM实验/PWM教学实验.html',
    '页面/电机控制/异步电机分析.html': '页面/电机控制/异步电机/异步电机分析.html',

  };
  let pathname;
  try { pathname = decodeURIComponent(location.pathname); } catch { return; }
  for (const [oldPath, newPath] of Object.entries(routes)) {
    if (!pathname.endsWith('/' + oldPath)) continue;
    const base = pathname.slice(0, -oldPath.length);
    const destination = encodeURI(base + newPath) + location.search + location.hash;
    document.getElementById('message').textContent = '正在打开新的中文地址';
    const link = document.getElementById('destination'); link.href = destination; link.textContent = '打开新页面';
    location.replace(destination); return;
  }
})();
